<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Kirill Ivanov — Applied AI and ML Developer</title>
  <desc id="desc">Dark violet gradient GitHub profile banner featuring Kirill Ivanov and abstract connected intelligence nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C19"/>
      <stop offset="0.52" stop-color="#111128"/>
      <stop offset="1" stop-color="#17102D"/>
    </linearGradient>
    <radialGradient id="violetHalo">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".38"/>
      <stop offset=".57" stop-color="#7C3AED" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueHalo">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="80" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#ECE7FF"/>
      <stop offset="1" stop-color="#BEA7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C4B5FD" opacity=".12"/>
    </pattern>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B39EFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#background)"/>
  <rect width="1280" height="400" rx="22" fill="url(#dots)"/>
  <circle cx="1080" cy="155" r="315" fill="url(#violetHalo)"/>
  <circle cx="945" cy="265" r="220" fill="url(#blueHalo)"/>
  <path d="M0 0H1280" stroke="#9E82E8" stroke-opacity=".3" stroke-width="2"/>
  <path d="M82 72H147" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="161" cy="72" r="4" fill="#38BDF8"/>
  <text x="82" y="113" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="5" fill="#B9A9FF">HELLO, I'M</text>
  <text x="77" y="193" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="78" letter-spacing="-2.4" fill="url(#headline)">Kirill Ivanov</text>
  <text x="82" y="237" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="3.6" font-weight="700" fill="#DCE4F7">AI / ML DEVELOPER</text>
  <text x="82" y="273" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".8" fill="#9AA6C2">Building intelligent systems from data to deployment</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">
    <rect x="82" y="300" width="173" height="32" rx="16" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".45"/>
    <text x="101" y="321" fill="#DDD5FF">COMPUTER VISION</text>
    <rect x="267" y="300" width="124" height="32" rx="16" fill="#38BDF8" fill-opacity=".10" stroke="#38BDF8" stroke-opacity=".35"/>
    <text x="289" y="321" fill="#B5EDFC">NLP / LLMS</text>
    <rect x="403" y="300" width="163" height="32" rx="16" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".45"/>
    <text x="422" y="321" fill="#DDD5FF">ML ENGINEERING</text>
  </g>

  <!-- Abstract network: a distinctive decorative mark, not a data chart. -->
  <g transform="translate(940 195)">
    <circle r="147" fill="none" stroke="#A78BFA" stroke-opacity=".12" stroke-width="1"/>
    <circle r="114" fill="none" stroke="#A78BFA" stroke-opacity=".19" stroke-width="1"/>
    <circle r="80" fill="none" stroke="#38BDF8" stroke-opacity=".20" stroke-width="1"/>
    <path d="M-110 -55L-20 -95L84 -57L119 40L38 100L-79 75Z" fill="#101A36" fill-opacity=".47" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <path d="M-110 -55L16 0L84 -57M16 0L119 40M16 0L38 100M16 0L-79 75M-20 -95L16 0M-110 -55L-79 75M84 -57L38 100" stroke="#8B7EE8" stroke-opacity=".53" stroke-width="1.6" fill="none"/>
    <path d="M-110 -55L84 -57L38 100L-110 -55" stroke="#38BDF8" stroke-opacity=".18" fill="none"/>
    <circle cx="-110" cy="-55" r="7" fill="#A78BFA"/>
    <circle cx="-20" cy="-95" r="6" fill="#C4B5FD"/>
    <circle cx="84" cy="-57" r="8" fill="#7DD3FC"/>
    <circle cx="119" cy="40" r="6.5" fill="#A78BFA"/>
    <circle cx="38" cy="100" r="7.5" fill="#38BDF8"/>
    <circle cx="-79" cy="75" r="7" fill="#A78BFA"/>
    <circle cx="16" cy="0" r="26" fill="#7C3AED" fill-opacity=".14" stroke="#C4B5FD" stroke-opacity=".68" stroke-width="2"/>
    <circle cx="16" cy="0" r="9" fill="#DDD6FE"/>
    <circle cx="16" cy="0" r="3.5" fill="#FFFFFF"/>
    <circle cx="-153" cy="-8" r="3" fill="#38BDF8" fill-opacity=".65"/>
    <circle cx="164" cy="-70" r="3.5" fill="#A78BFA" fill-opacity=".9"/>
    <circle cx="120" cy="-126" r="2.5" fill="#38BDF8" fill-opacity=".75"/>
  </g>
  <path d="M82 356H1198" stroke="#9AA6C2" stroke-opacity=".18"/>
  <text x="82" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.3" fill="#9CA9C6">MOSCOW  /  RTU MIREA</text>
  <text x="1198" y="378" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.3" fill="#A8A4D9">GITHUB  •  2026</text>
</svg>